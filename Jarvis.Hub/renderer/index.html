<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS HUB</title>
  <link rel="stylesheet" href="styles/fluent.css" />
</head>
<body class="mica">
  <!-- Windows 11 style caption bar -->
  <header class="titlebar">
    <div class="titlebar-brand">
      <div class="brand-mark">J</div>
      <span class="brand-name">JARVIS HUB</span>
      <span id="connection-pill" class="pill pill-warn">connecting</span>
    </div>
    <div class="titlebar-controls no-drag">
      <button class="tb-btn" id="btn-minimize" title="Minimize">&#xE921;</button>
      <button class="tb-btn" id="btn-maximize" title="Maximize">&#xE922;</button>
      <button class="tb-btn tb-close" id="btn-close" title="Close">&#xE8BB;</button>
    </div>
  </header>

  <div class="shell">
    <!-- Navigation -->
    <nav class="sidebar">
      <a class="nav-item is-active" data-view="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v4h-7V4zm0 7h7v9h-7v-9zM4 13h7v7H4v-7z"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" data-view="chat">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16v12H7.4L4 19V4z"/></svg>
        <span>Assistant</span>
      </a>
      <a class="nav-item" data-view="memory">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3h12v18H8a4 4 0 0 1-4-4V6h2V3zm3 5h6v2H9V8zm0 4h6v2H9v-2z"/></svg>
        <span>Memory</span>
      </a>
      <a class="nav-item" data-view="plugins">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l9 4v6c0 5-3.8 8.5-9 10-5.2-1.5-9-5-9-10V6l9-4zm-1.5 12.6l5-5-1.4-1.4-3.6 3.6-1.6-1.6-1.4 1.4 3 3z"/></svg>
        <span>Plugins</span>
      </a>
      <a class="nav-item" data-view="system">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v2h3a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2h3v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v10h16V6H4z"/></svg>
        <span>System</span>
      </a>
      <a class="nav-item" data-view="settings">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4l-1.8 1.6.4 2.4-2.3 1-1.2 2.1-2.4-.7L11.6 21l-2.4-1-1.2-2.1-2.3-1 .4-2.4L4 12l1.8-1.6-.4-2.4 2.3-1L8.9 5l2.4.7L13.8 4l2.4 1 1.2 2.1 2.3 1-.4 2.4L21 12z"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Views -->
    <main class="content">
      <section id="view-dashboard" class="view is-active"></section>
      <section id="view-chat" class="view"></section>
      <section id="view-memory" class="view"></section>
      <section id="view-plugins" class="view"></section>
      <section id="view-system" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
